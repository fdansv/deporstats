<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">El Dépor, en datos</title>
  <desc id="desc">Social preview for deporstats, a data story about Deportivo de La Coruña.</desc>
